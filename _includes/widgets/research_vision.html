{%- assign v = site.data.profile -%}
<div class="mt-3 d-md-none"></div>
<div class="row">
    <div class="col">
        <div class="vision-card">
            <div class="vision-kicker">Research Vision</div>
            <h1 class="vision-title">{{ v.vision_title }}</h1>
            <p class="vision-summary">{{ v.vision_summary }}</p>
            <div class="vision-thrusts">
                {% for t in v.vision_thrusts %}
                <a class="vision-thrust" href="{{ t.url | relative_url }}">
                    <div class="vision-num">0{{ forloop.index }}</div>
                    <div class="vision-label">{{ t.label }}</div>
                    <div class="vision-line">{{ t.line }}</div>
                    <div class="vision-link">{{ t.link_name }} <i class="fas fa-arrow-right"></i></div>
                </a>
                {% endfor %}
            </div>
            <div class="vision-question"><span>The question that drives me</span>{{ v.vision_question }}</div>
        </div>
    </div>
</div>
