{%- assign news = site.news | sort: "date" | reverse -%}
<div class="row mt-3">
    <div class="col">
        <div class="card border-0 shadow-sm projects-shell">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-baseline mb-3">
                    <div class="section-kicker mb-0"><i class="fas fa-bullhorn mr-1"></i>News</div>
                    <a class="small" href="{{ '/news' | relative_url }}">All news <i class="fas fa-arrow-right"></i></a>
                </div>
                <ul class="news-list">
                    {% for item in news limit: include.limit %}
                    <li class="news-item">
                        <span class="news-date">{{ item.date | date: "%b %Y" }}</span>
                        <span class="news-text">{{ item.title }}</span>
                    </li>
                    {% endfor %}
                </ul>
            </div>
        </div>
    </div>
</div>
