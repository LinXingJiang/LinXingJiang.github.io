# Capabilities shown in the homepage capability map.
# A project lists the keys it covers in its front matter: `capabilities: [agents, rl]`.
- key: agents
  color: "#2563eb"
  name: LLM Agents
  short: Agents
  icon: fas fa-robot
  meaning: Models that plan, use tools, and act over many steps.
- key: rl
  color: "#7c3aed"
  name: Reinforcement Learning
  short: RL
  icon: fas fa-chart-line
  meaning: Learning from outcomes, not just imitation.
- key: memory
  color: "#059669"
  name: Memory & Self-Improvement
  short: Self-Evolve
  icon: fas fa-seedling
  meaning: Getting better from experience, often without new weights.
- key: infra
  color: "#d97706"
  name: Training & Inference Infrastructure
  short: Infra
  icon: fas fa-server
  meaning: Training and serving models correctly, at speed.
- key: data
  color: "#0891b2"
  name: Data & Retrieval
  short: Data
  icon: fas fa-database
  meaning: Training data, and grounding models in real knowledge.
- key: eval
  color: "#db2777"
  name: Evaluation
  short: Eval
  icon: fas fa-ruler-combined
  meaning: Measuring what models can really do.
