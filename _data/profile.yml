short_bio: >-
  <p>
    I am an M.S. Computer Science student at the University at Buffalo. My research asks what large language models
    actually learn and how they improve: how an agent's behavior can be trained through its skills without touching
    model weights, how reinforcement learning assigns credit across long multi-step trajectories, and how evaluation
    choices can quietly change the conclusions we draw about what a model can do.
  </p>
  <p>
    Before graduate school I spent two years in industry, building market-data services at LSEG and production LLM
    systems at Luming. Watching models meet real users is what made me care about this question: a claim about a
    model's capability should hold up under careful measurement, not just in a convincing example.
  </p>

