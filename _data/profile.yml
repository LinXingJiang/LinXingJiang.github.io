vision_title: "I want to understand how intelligence is learned, and build AI that keeps getting better on its own."
vision_summary: >-
  Today's models are trained once and then frozen. The systems I want to build learn from every task they attempt,
  every mistake they make, and every person they teach, and I want to understand that learning well enough to
  trust it. That takes three things at once: a theory of what learning changes inside a model, methods that let
  systems improve themselves, and the infrastructure to train and run them correctly.
