vision_questions:
- Can an agent improve from experience as reliably without weight updates as RL does with them?
- When does RL teach a model something new, and how would we measure it?
- Can a tutor learn which teaching moves work, the way a student learns which solutions work?
- What would it take to trust the gains of a system that improves itself?

